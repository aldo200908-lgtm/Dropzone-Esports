name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.6.2
      - run: npm install --no-audit --no-fund
      - run: node --check docs/site.js
      - run: node --check docs/auth.js
      - run: node --test tests/static-auth.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
